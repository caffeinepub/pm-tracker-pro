<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plant Maintenance Management System</title>
    <meta name="description" content="Industrial Plant Maintenance Management System — Preventive, Predictive & Breakdown Maintenance" />
    <meta name="theme-color" content="#0f1e35" />

    <!-- PWA / Home Screen -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PMMS" />
    <link rel="apple-touch-icon" href="/assets/generated/pmms-icon-192.dim_192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/assets/generated/pmms-icon-512.dim_512x512.png" />

    <!-- Splash screen color for iOS -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Splash screen background style so the gap before app loads shows brand color -->
    <style>
      html, body { background-color: #0f1e35; margin: 0; padding: 0; }
      #root { min-height: 100vh; }
      #splash {
        position: fixed; inset: 0;
        background: #0f1e35;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      #splash img { width: 100px; height: 100px; border-radius: 20px; margin-bottom: 20px; }
      #splash h1 { color: #ffffff; font-family: sans-serif; font-size: 22px; font-weight: 700; margin: 0 0 6px; letter-spacing: 1px; }
      #splash p { color: #8ab4d4; font-family: sans-serif; font-size: 13px; margin: 0; }
      #splash.hidden { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <!-- Splash screen shown while React loads -->
    <div id="splash">
      <img src="/assets/generated/pmms-icon-512.dim_512x512.png" alt="PMMS Logo" />
      <h1>PMMS</h1>
      <p>Plant Maintenance Management System</p>
    </div>
    <div id="root"></div>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide splash once React has rendered
      window.addEventListener('load', function() {
        setTimeout(function() {
          var splash = document.getElementById('splash');
          if (splash) {
            splash.classList.add('hidden');
            setTimeout(function() { splash.remove(); }, 600);
          }
        }, 800);
      });
    </script>
  </body>
</html>
